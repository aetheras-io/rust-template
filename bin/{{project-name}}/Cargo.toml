[package]
name = "{{project-name}}-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "{{ project-name | kebab_case }}"
path = "src/main.rs"

[dependencies]
{{project-name}}-core = { path = "../../core" }

atb-types = { workspace = true }
atb-tokio-ext = { workspace = true }
atb-fixtures-utils = { workspace = true }
atb-logging = { workspace = true }
temporalio-client = { workspace = true }
temporalio-sdk = { workspace = true }

sqlx = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

atb-cli-utils = "2"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-client-ip = "1"
axum-extra = { version = "0.12", features = ["typed-header"] }
async-graphql = { version = "7", features = [
  "uuid",
  "chrono",
  "chrono-tz",
  "dataloader",
] }
async-graphql-axum = { version = "7" }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"] }
clap = { version = "4", features = ["derive", "env"] }
validator = { version = "0.21", features = ["derive"] }
rand.workspace = true
base64.workspace = true

[build-dependencies]
atb-build-utils = "2"
