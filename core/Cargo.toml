[package]
name = "{{project-name}}-core"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
once_cell = { workspace = true }
sqlx = { workspace = true }
atb-types = { workspace = true }

temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-sdk = { workspace = true }
temporalio-workflow = { workspace = true }
# SDK testing enables the CLI downloader without selecting a reqwest TLS backend.
reqwest = { workspace = true, optional = true }

[features]
default = []
temporal-tests = ["temporalio-sdk/testing", "dep:reqwest"]
