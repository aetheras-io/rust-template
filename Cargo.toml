[workspace]
members = ["crates/core", "bin/{{project-name}}"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["{{author}} <{{email}}>"]
repository = "https://github.com/{{org}}/{{ project-name | kebab_case }}"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
atb-types = { version = "2.1.0", features = [
  "jwt",
] }
atb-tokio-ext = "2.1.0"
atb-fixtures-utils = { version = "2.1.0", features = [
  "jwt",
] }
atb-logging = "2.1.0"

temporalio-client = "1.1.0"
temporalio-common = "1.1.0"
temporalio-macros = "1.1.0"
temporalio-sdk = "1.1.0"
temporalio-workflow = "1.1.0"

strum = { version = "0.28.0", features = ["derive"] }
num_enum = { version = "0.7.6" }
tracing = { version = "0.1.44" }
anyhow = { version = "1.0.104" }
thiserror = { version = "2.0.21" }
serde = { version = "1.0.229" }
serde_json = { version = "1.0.154" }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
cfg-if = { version = "1.0.5" }
once_cell = { version = "1.21.4" }
rand = { version = "0.10.3" }
base64 = { version = "0.23.1" }
reqwest = { version = "0.13.5", default-features = false, features = [
  "socks",
  "stream",
  "json",
  "rustls",
] }
tokio = { version = "1.53.2", features = [
  "signal",
  "rt-multi-thread",
  "net",
  "time",
  "macros",
  "sync",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "bigdecimal",
  "rust_decimal",
  "bit-vec",
  "any",
  "migrate",
  "ipnetwork",
] }
sea-query = { version = "1.0.2", default-features = false, features = [
  "backend-postgres",
  "derive",
  "thread-safe",
  "with-chrono",
  "with-uuid",
] }
sea-query-sqlx = { version = "0.9.1", default-features = false, features = [
  "sqlx-postgres",
  "with-chrono",
  "with-uuid",
] }
ipnetwork = "0.21.1"
futures = "0.3.34"
futures-channel = { version = "0.3.34" }
futures-util = "0.3.34"
regex = { version = "1.13.1" }
rust_decimal = { version = "1.43.0", features = [
  "serde-with-arbitrary-precision",
] }
